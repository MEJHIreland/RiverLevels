<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upper Liffey Levels</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Annotation plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.1"></script>

  <!-- Date adapter for time scale -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>

  <h2 style="text-align:center;">Upper Liffey at Sean Kelly Bridge</h2>

  <div style="width: 90%; height: 400px; margin: auto;">
    <canvas id="myChart"></canvas>
  </div>

  <div style="width: 90%; margin: auto; text-align: center; margin-top: 10px;">
    <p><i>Data shown is for informative purposes and provided in good faith. Always check conditions before paddling.</i></p>
  </div>

  <script>
    const channelID = 3023871;
    const fieldNumber = 1;
    const resultsCount = 2000;
    const refreshInterval = 15000;
    const readAPIKey = "MOBXUAXGXG554IBK";

    const url = `https://api.thingspeak.com/channels/${channelID}/fields/${fieldNumber}.json?api_key=${readAPIKey}&results=${resultsCount}`;

    let chart;

    // Register annotation plugin
    Chart.register(window['chartjs-plugin-annotation']);

    async function fetchData() {
      try {
        const response = await fetch(url);
        const data = await response.json();

        // Map data to x (date) / y (value)
        const filtered = data.feeds
          .map(entry => ({
            value: Number(entry[`field${fieldNumber}`]),
            date: new Date(entry.created_at)
          }))
          .filter(entry => !isNaN(entry.value));

        // Filter for last 4 days + today
        const fiveDaysAgo = new Date();
        fiveDaysAgo.setDate(fiveDaysAgo.getDate() - 4);

        const values = filtered
          .filter(entry => entry.date >= fiveDaysAgo)
          .map(entry => ({ x: entry.date, y: entry.value }));

        updateChart(values);

      } catch (error) {
        console.error("Error fetching data:", error);
      }
    }

    function createChart(values) {
      const ctx = document.getElementById('myChart').getContext('2d');

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [{
            label: 'Depth',
            data: values,
            borderColor: 'blue',
            borderWidth: 2,
            fill: false,
            tension: 0.2,
            parsing: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            x: {
              type: 'time',
              time: {
                unit: 'day',
                displayFormats: { day: 'MMM dd' }
              },
              min: new Date(new Date().setDate(new Date().getDate() - 4)), // 4 days ago
              max: new Date(new Date().setDate(new Date().getDate() + 1)), // tomorrow
              title: {
                display: true,
                text: 'Date',
                font: { size: 14, weight: 'bold' }
              },
              ticks: {
                autoSkip: true,
                maxTicksLimit: 6
              }
            },
            y: {
              min: 0,
              max: 30,
              title: {
                display: true,
                text: 'Depth (cm)',
                font: { size: 14, weight: 'bold' }
              },
              ticks: {
                stepSize: 5,
                callback: value => value + ' cm'
              }
            }
          },
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: {
                font: { size: 14, weight: 'bold' },
                color: 'blue',
                boxWidth: 20,
                padding: 15
              }
            },
            annotation: {
              annotations: {
                thresholdLine1: {
                  type: 'line',
                  yMin: 10,
                  yMax: 10,
                  borderColor: 'green',
                  borderWidth: 2,
                  label: { display: true, content: 'Low', position: 'start' }
                },
                thresholdLine2: {
                  type: 'line',
                  yMin: 17,
                  yMax: 17,
                  borderColor: 'orange',
                  borderWidth: 2,
                  label: { display: true, content: 'Medium', position: 'start' }
                },
                thresholdLine3: {
                  type: 'line',
                  yMin: 23,
                  yMax: 23,
                  borderColor: 'red',
                  borderWidth: 2,
                  label: { display: true, content: 'High', position: 'start' }
                }
              }
            },
            tooltip: {
    enabled: true,
    mode: 'nearest',
    intersect: true,
    displayColors: false,         // removes the small legend square
    backgroundColor: 'rgba(0,0,0,0.8)',
    titleFont: { size: 14, weight: 'bold' },
    bodyFont: { size: 12 },
    padding: 10,
    cornerRadius: 6,
    callbacks: {
      label: function(context) {
        const date = new Date(context.parsed.x);
        const dateStr = date.toLocaleDateString();                     // e.g., Mar 24, 2026
        const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); // e.g., 14:30
        const depth = context.parsed.y;

        // Return array → each element is a separate line
        return [
          dateStr,
          timeStr,
          `${depth} cm`
        ];
      }
    }
  }
}
          }
        }
      });
    }

    function updateChart(values) {
      if (!chart) {
        createChart(values);
      } else {
        chart.data.datasets[0].data = values;
        chart.update();
      }
    }

    // Initial load
    fetchData();

    // Auto-refresh
    setInterval(fetchData, refreshInterval);
  </script>

</body>
</html>
