<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upper Liffey Levels</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Annotation plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.1"></script>
</head>
<body>

  <h2 style="text-align:center;">Upper Liffey at Sean Kelly Bridge</h2>

  <div style="width: 90%; height: 400px; margin: auto;">
    <canvas id="myChart"></canvas>
  </div>

  <div style="width: 90%; margin: auto; text-align: center; margin-top: 10px;">
    <p><i>Data shown is for informative purposes and provided in good faith. Always check conditions before paddling.</i></p>
  </div>

  <script>
    const channelID = 3023871;
    const fieldNumber = 1;
    const resultsCount = 2000;
    const refreshInterval = 15000;
    const readAPIKey = "MOBXUAXGXG554IBK";

    const url = `https://api.thingspeak.com/channels/${channelID}/fields/${fieldNumber}.json?api_key=${readAPIKey}&results=${resultsCount}`;

    let chart;

    // ✅ Register annotation plugin (required)
    Chart.register(window['chartjs-plugin-annotation']);

    async function fetchData() {
      try {
        const response = await fetch(url);
        const data = await response.json();

        // ✅ Keep labels + values aligned
        const filtered = data.feeds
          .map(entry => ({
            value: Number(entry[`field${fieldNumber}`]),
            date: new Date(entry.created_at)
          }))
          .filter(entry => !isNaN(entry.value));

        const labels = filtered.map(entry => {
          const date = entry.date;
          if (date.getHours() === 0 && date.getMinutes() === 0) {
            return date.toLocaleDateString();
          }
          if (date.getMinutes() === 0) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }
          return '';
        });

        const values = filtered.map(entry => entry.value);

        updateChart(labels, values);

      } catch (error) {
        console.error("Error fetching data:", error);
      }
    }

    function createChart(labels, values) {
      const ctx = document.getElementById('myChart').getContext('2d');

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Depth',
            data: values,
            borderColor: 'blue',
            borderWidth: 2,
            fill: false,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            y: {
              min: 0,
              max: 30,
              ticks: { stepSize: 5 }
            }
          },
          plugins: {
            annotation: {
              annotations: {
                thresholdLine1: {
                  type: 'line',
                  yMin: 10,
                  yMax: 10,
                  borderColor: 'green',
                  borderWidth: 2,
                  label: {
                    display: true,
                    content: 'Low',
                    position: 'start'
                  }
                },
                thresholdLine2: {
                  type: 'line',
                  yMin: 17,
                  yMax: 17,
                  borderColor: 'orange',
                  borderWidth: 2,
                  label: {
                    display: true,
                    content: 'Medium',
                    position: 'start'
                  }
                },
                thresholdLine3: {
                  type: 'line',
                  yMin: 23,
                  yMax: 23,
                  borderColor: 'red',
                  borderWidth: 2,
                  label: {
                    display: true,
                    content: 'High',
                    position: 'start'
                  }
                }
              }
            }
          }
        }
      });
    }

    function updateChart(labels, values) {
      if (!chart) {
        createChart(labels, values);
      } else {
        chart.data.labels = labels;
        chart.data.datasets[0].data = values;
        chart.update();
      }
    }

    // Initial load
    fetchData();

    // Auto-refresh
    setInterval(fetchData, refreshInterval);
  </script>

</body>
</html>
