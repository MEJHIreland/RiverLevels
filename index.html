<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ThingSpeak Live Temperature</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Annotation plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.1"></script>
</head>
<body>

  <h2 style="text-align:center;">Upper Liffey Level (m)</h2>

  <div style="width: 90%; height: 400px; margin: auto;">
    <canvas id="myChart"></canvas>
  </div>

  <div style="width: 90%; margin: auto; text-align: center; margin-top: 10px;">
  <p><i>Data shown is for informative purposes and provided in good faith. Always check conditions before paddling. </i>i></p>
  </div>

  <script>
    const channelID = 3023871;
    const fieldNumber = 1;
    const resultsCount = 2000; // number of points to fetch (~5 days)
    const refreshInterval = 15000; // 15 seconds
    const readAPIKey = "MOBXUAXGXG554IBK";

    const url = `https://api.thingspeak.com/channels/${channelID}/fields/${fieldNumber}.json?api_key=${readAPIKey}&results=${resultsCount}`;

    let chart;

    async function fetchData() {
      try {
        const response = await fetch(url);
        const data = await response.json();

        // Prepare labels: first entry of day = date, every hour = time
        const labels = data.feeds.map(entry => {
          const date = new Date(entry.created_at);
          if (date.getHours() === 0 && date.getMinutes() === 0) {
            return date.toLocaleDateString();
          }
          if (date.getMinutes() === 0) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }
          return '';
        });

        // Extract numerical values
        const values = data.feeds
          .map(entry => Number(entry[`field${fieldNumber}`]))
          .filter(val => !isNaN(val));

        updateChart(labels, values);
      } catch (error) {
        console.error("Error fetching data:", error);
      }
    }

    function createChart(labels, values) {
      const ctx = document.getElementById('myChart').getContext('2d');

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '(meters)',
            data: values,
            borderColor: 'blue',
            borderWidth: 2,
            fill: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            y: {
              min: 0,
              max: 30,
              ticks: { stepSize: 5 }
            }
          },
          plugins: {
            annotation: {
              annotations: {
                thresholdLine1: {      // first threshold
                  type: 'line',
                  yMin: 10,
                  yMax: 10,
                  borderColor: 'green',
                  borderWidth: 2,
                  label: {
                    enabled: true,
                    content: 'Threshold 10°C',
                    position: 'end',
                    backgroundColor: 'rgba(0,0,0,0.7)',
                    color: 'white',
                    font: { size: 12, weight: 'bold' }
                  }
                },
                thresholdLine2: {      // second threshold
                  type: 'line',
                  yMin: 20,
                  yMax: 20,
                  borderColor: 'orange',
                  borderWidth: 2,
                  label: {
                    enabled: true,
                    content: 'Threshold 20°C',
                    position: 'end',
                    backgroundColor: 'rgba(0,0,0,0.7)',
                    color: 'white',
                    font: { size: 12, weight: 'bold' }
                  }
                },
                thresholdLine3: {      // third threshold
                  type: 'line',
                  yMin: 30,
                  yMax: 30,
                  borderColor: 'red',
                  borderWidth: 2,
                  label: {
                    enabled: true,
                    content: 'Threshold 30°C',
                    position: 'end',
                    backgroundColor: 'rgba(0,0,0,0.7)',
                    color: 'white',
                    font: { size: 12, weight: 'bold' }
                  }
                }
              }
            }
          }
        }
      });
    }

    function updateChart(labels, values) {
      if (!chart) {
        createChart(labels, values);
      } else {
        chart.data.labels = labels;
        chart.data.datasets[0].data = values;
        chart.update();
      }
    }

    // Initial load
    fetchData();

    // Auto-refresh
    setInterval(fetchData, refreshInterval);
  </script>

</body>
</html>
