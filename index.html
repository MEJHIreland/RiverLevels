<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upper Liffey Levels</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Annotation plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.1"></script>

  <!-- Date adapter for time scale -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>

  <h2 style="text-align:center;">Upper Liffey at Sean Kelly Bridge</h2>

  <div style="width: 90%; height: 400px; margin: auto;">
    <canvas id="myChart"></canvas>
  </div>

  <div style="width: 90%; margin: auto; text-align: center; margin-top: 10px;">
    <p><i>Data shown is for informative purposes and provided in good faith. Always check conditions before paddling.</i></p>
  </div>

  <script>
    const channelID = 3023871;
    const fieldNumber = 1;
    const resultsCount = 2000;
    const refreshInterval = 15000;
    const readAPIKey = "MOBXUAXGXG554IBK";

    const url = `https://api.thingspeak.com/channels/${channelID}/fields/${fieldNumber}.json?api_key=${readAPIKey}&results=${resultsCount}`;

    let chart;

    // Register annotation plugin
    Chart.register(window['chartjs-plugin-annotation']);

    async function fetchData() {
      try {
        const response = await fetch(url);
        const data = await response.json();

        // Map data to x (date) / y (value)
        const filtered = data.feeds
          .map(entry => ({
            value: Number(entry[`field${fieldNumber}`]),
            date: new Date(entry.created_at)
          }))
          .filter(entry => !isNaN(entry.value));

        const values = filtered.map(entry => ({
          x: entry.date,
          y: entry.value
        }));

        updateChart(values);

      } catch (error) {
        console.error("Error fetching data:", error);
      }
    }

    function createChart(values) {
      const ctx = document.getElementById('myChart').getContext('2d');

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [{
            label: 'Depth',
            data: values,
            borderColor: 'blue',
            borderWidth: 2,
            fill: false,
            tension: 0.2,
            parsing: false  // important for time scale
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            x: {
              type: 'time',
              time: {
                unit: 'day',
                displayFormats: {
                  day: 'MMM dd'  // e.g., Mar 24
                }
              },
              min: new Date(new Date().setDate(new Date().getDate() - 4)), // 4 days ago
              max: new Date(), // today
              ticks: {
                autoSkip: true,
                maxTicksLimit: 10
              }
            },
            y: {
              min: 0,
              max: 30,
              ticks: { stepSize: 5 }
            }
          },
          plugins: {
            annotation: {
              annotations: {
                thresholdLine1: {
                  type: 'line',
                  yMin: 10,
                  yMax: 10,
                  borderColor: 'green',
                  borderWidth: 2,
                  label: {
                    display: true,
                    content: '10°C',
                    position: 'start'
                  }
                },
                thresholdLine2: {
                  type: 'line',
                  yMin: 17,
                  yMax: 17,
                  borderColor: 'orange',
                  borderWidth: 2,
                  label: {
                    display: true,
                    content: '17°C',
                    position: 'start'
                  }
                },
                thresholdLine3: {
                  type: 'line',
                  yMin: 23,
                  yMax: 23,
                  borderColor: 'red',
                  borderWidth: 2,
                  label: {
                    display: true,
                    content: '23°C',
                    position: 'start'
                  }
                }
              }
            }
          }
        }
      });
    }

    function updateChart(values) {
      if (!chart) {
        createChart(values);
      } else {
        chart.data.datasets[0].data = values;
        chart.update();
      }
    }

    // Initial load
    fetchData();

    // Auto-refresh
    setInterval(fetchData, refreshInterval);
  </script>

</body>
</html>
