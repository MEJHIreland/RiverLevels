<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ThingSpeak Live Temperature</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <h2 style="text-align:center;">Live Temperature (°C)</h2>

  <div style="width: 80%; height: 400px; margin: auto;">
    <canvas id="myChart"></canvas>
  </div>

  <script>
    const channelID = 3023871;
    const fieldNumber = 1;
    const resultsCount = 20;
    const refreshInterval = 15000; // 15 seconds
    const readAPIKey = "MOBXUAXGXG554IBK";

    const url = `https://api.thingspeak.com/channels/${channelID}/fields/${fieldNumber}.json?api_key=${readAPIKey}&results=${resultsCount}`;

    let chart;

    async function fetchData() {
      try {
        const response = await fetch(url);
        const data = await response.json();

        const labels = data.feeds.map(entry =>
          new Date(entry.created_at).toLocaleTimeString()
        );

        const values = data.feeds
          .map(entry => Number(entry[`field${fieldNumber}`]))
          .filter(val => !isNaN(val));

        updateChart(labels, values);
      } catch (error) {
        console.error("Error fetching data:", error);
      }
    }

    function createChart(labels, values) {
      const ctx = document.getElementById('myChart').getContext('2d');

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Temperature (°C)',
            data: values,
            borderWidth: 2,
            fill: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            y: {
              min: 0,
              ticks: {
                stepSize: 5
              }
            }
          }
        }
      });
    }

    function updateChart(labels, values) {
      if (!chart) {
        createChart(labels, values);
      } else {
        chart.data.labels = labels;
        chart.data.datasets[0].data = values;

        // Dynamically adjust max to prevent zooming
        const maxValue = Math.max(...values);
        chart.options.scales.y.suggestedMax = maxValue + 5;

        chart.update();
      }
    }

    // Initial load
    fetchData();

    // Auto-refresh every 15 seconds
    setInterval(fetchData, refreshInterval);

  </script>

</body>
</html>
